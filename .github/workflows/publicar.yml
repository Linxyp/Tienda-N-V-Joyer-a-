name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Configurar dirección del sitio
        # Esta copia vive en https://<usuario>.github.io/<repositorio>/ (respaldo), pero el sitio
        # principal es https://nyvjoyeria.lux-ia.com: los enlaces canónicos, el mapa del sitio, las
        # vistas previas al compartir y los enlaces de los pedidos por WhatsApp apuntan allá.
        run: |
          REPO="${{ github.event.repository.name }}"
          echo "NEXT_PUBLIC_BASE_PATH=/${REPO}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=https://nyvjoyeria.lux-ia.com" >> "$GITHUB_ENV"
      - run: npm run build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
